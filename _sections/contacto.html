<div>
    <div class="formWrapper">
        <form id="contactForm">

            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" placeholder="Nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone" name="phone" placeholder="Teléfono" required>
            </div>

            <div class="form-group">
                <label for="message">Cuéntanos en qué podemos ayudarte</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <!-- Consentimiento privacidad -->
            <div class="form-group privacy-group">
                <label for="privacy" class="privacy-label">
                    <input id="privacy" name="privacy" type="checkbox" required />
                    <span>
                        He leído y acepto la 
                        <a href="{{ 'legal/privacy.html' | relative_url }}" target="_blank">
                            política de privacidad
                        </a>
                    </span>
                </label>
            </div>

            <div class="error"></div>

            <div class="center">
                <button type="submit" class="button">Enviar</button>
            </div>

        </form>

        <div class="success"></div>
    </div>
</div>
